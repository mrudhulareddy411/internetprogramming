<!DOCTYPE html>
<html>
<head>
<style>
body{
font-family:Arial;
display:flex;
justify-content:center;
margin-top:50px;
}
.card{
width:220px;
border:1px solid gray;
padding:15px;
text-align:center;
transition:0.4s;
}
.card img{
width:100%;
}
.card:hover{
transform:scale(1.05);
box-shadow:0 0 15px gray;
}
button{
background:green;
color:white;
padding:10px;
border:none;
cursor:pointer;
}
button:hover{
background:darkgreen;
}
</style>
</head>
<body>

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Smart Watch</h3>
<p>$199</p>
<button>Buy Now</button>
</div>

</body>
</html>

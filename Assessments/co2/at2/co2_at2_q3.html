<!DOCTYPE html>
<html>
<head>
<title>Dashboard Layout using CSS Grid</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

.container{
display:grid;
grid-template-columns:220px 1fr;
grid-template-rows:70px auto 60px;
grid-template-areas:
"header header"
"sidebar main"
"footer footer";
height:100vh;
gap:10px;
padding:10px;
}

.header{
grid-area:header;
background:#3498db;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
}

.sidebar{
grid-area:sidebar;
background:#2c3e50;
color:white;
padding:20px;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li{
padding:12px;
margin:10px 0;
background:#34495e;
text-align:center;
border-radius:5px;
cursor:pointer;
}

.sidebar ul li:hover{
background:#1abc9c;
}

.main{
grid-area:main;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:white;
padding:30px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px gray;
font-size:20px;
font-weight:bold;
}

.footer{
grid-area:footer;
background:#3498db;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:18px;
}

@media(max-width:768px){

.container{

grid-template-columns:1fr;

grid-template-areas:

"header"

"sidebar"

"main"

"footer";

}

.main{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">
Dashboard
</div>

<div class="sidebar">
<h2>Menu</h2>

<ul>
<li>Home</li>
<li>Analytics</li>
<li>Reports</li>
<li>Settings</li>
<li>Profile</li>
</ul>

</div>

<div class="main">

<div class="card">Users</div>

<div class="card">Sales</div>

<div class="card">Revenue</div>

<div class="card">Orders</div>

<div class="card">Products</div>

<div class="card">Performance</div>

</div>

<div class="footer">
© 2026 Dashboard Application
</div>

</div>

</body>
</html>

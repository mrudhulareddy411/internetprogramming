<!DOCTYPE html>
<html>
<head>
<title>Dynamic Menu using JavaScript</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#2c3e50;
color:white;
padding:20px;
text-align:center;
font-size:28px;
}

.menu-btn{
background:#27ae60;
color:white;
padding:12px 20px;
border:none;
cursor:pointer;
font-size:18px;
margin:20px;
border-radius:5px;
}

.menu-btn:hover{
background:#219150;
}

#menu{
display:none;
background:#34495e;
width:220px;
margin-left:20px;
border-radius:5px;
}

#menu ul{
list-style:none;
}

#menu ul li{
padding:15px;
border-bottom:1px solid white;
}

#menu ul li:last-child{
border-bottom:none;
}

#menu ul li a{
color:white;
text-decoration:none;
display:block;
}

#menu ul li:hover{
background:#1abc9c;
}

.show{
display:block;
}

.message{
margin:20px;
font-size:18px;
color:#333;
font-weight:bold;
}

</style>

</head>

<body>

<header>
Dynamic Navigation Menu
</header>

<button class="menu-btn" id="toggleBtn">
☰ Menu
</button>

<div id="menu">
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Contact</a></li>
</ul>
</div>

<p class="message" id="status">
Click the Menu button to open the navigation.
</p>

<script>

let button=document.getElementById("toggleBtn");
let menu=document.getElementById("menu");
let status=document.getElementById("status");

button.addEventListener("click",function(){

menu.classList.toggle("show");

if(menu.classList.contains("show")){
status.innerHTML="Menu Opened";
}
else{
status.innerHTML="Menu Closed";
}

});

menu.addEventListener("mouseover",function(){
menu.style.background="#16a085";
});

menu.addEventListener("mouseout",function(){
menu.style.background="#34495e";
});

</script>

</body>
</html>
